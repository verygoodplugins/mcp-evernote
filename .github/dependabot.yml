version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      # typescript 7 violates the peer ranges of @typescript-eslint (<6.1.0) and
      # ts-jest (<7), so `npm ci` fails with ERESOLVE. Lift once both support it.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # marked 13+ passes token objects to renderer overrides (src/markdown.ts
      # uses the positional image(href, title, text) signature). Jest now runs
      # in ESM mode, so 16+ being ESM-only is no longer a blocker; the
      # renderer migration in markdown.ts still is.
      - dependency-name: "marked"
        versions: [">=13.0.0"]
      # cheerio 1.1.1+ declares node >=20.18.1 (covered by our >=22.12 floor
      # since #82) but depends on undici ^7, which conflicts with the
      # `undici: ^6.21.0` override in package.json. Lift with that override.
      - dependency-name: "cheerio"
        versions: [">=1.1.1"]
    groups:
      npm-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
